# =============================================================================
# Transit & Tile — Application Properties
# =============================================================================
# IMPORTANT: This file is committed to source control.
# It contains NO real credentials. All secrets must be supplied via
# environment variables (see README.md for the required variable names).
# =============================================================================

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server.port=8081

# -----------------------------------------------------------------------------
# DataSource — MySQL 8
# Credentials are read exclusively from environment variables.
# Set DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD in your shell
# or a local .env file (never commit the real .env file).
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:transit_and_tile_db}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------------
# SQL Initialization & JPA / Hibernate
# -----------------------------------------------------------------------------
# Execute schema.sql and data.sql to initialize tables and sample hotels safely.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# Schema creation is handled by schema.sql; ddl-auto set to none to avoid conflict.
spring.jpa.hibernate.ddl-auto=none

# Show SQL in logs during development for visibility; set to false in production.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Target MySQL 8 dialect explicitly.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Fail fast if the database cannot be reached at startup.
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# Jackson — JSON serialization
# -----------------------------------------------------------------------------
# Serialize dates as ISO strings (e.g. "2026-11-12"), not numeric timestamps.
spring.jackson.serialization.write-dates-as-timestamps=false

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.com.transitandtile=DEBUG
logging.level.org.springframework.web=INFO
# Never log full SQL parameter values in production; DEBUG is acceptable locally.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
